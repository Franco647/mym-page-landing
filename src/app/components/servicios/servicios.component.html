<section id="servicios" class="servicios-section py-5">
  <div class="container-fluid px-4 px-lg-5">
    
    <div class="text-center mb-5" data-aos="fade-in">
      <h2 class="display-5 text-uppercase">Nuestros <span class="text-danger">Servicios</span></h2>
      <p class="text-muted lead">Soluciones integrales de impresión para tu empresa o emprendimiento</p>
    </div>

    <div class="row g-4 justify-content-center">
      
      <div 
        class="col-6 col-md-4 col-lg-3 col-xl-2 d-flex align-items-stretch" 
        *ngFor="let s of servicios; let i = index" 
        data-aos="fade-up" 
        [attr.data-aos-delay]="i * 50"
      >
        <div class="service-card w-100 shadow-sm">
          <div class="icon-box">
            <i class="fas {{s.icon}} fa-3x"></i>
          </div>
          <h5 class="card-title">{{s.title}}</h5>
        </div>

      </div>

    </div>
  </div>
</section>
