<section id="cotizacion" class="py-5 bg-light">
  <div class="container" data-aos="fade-up">
    
    <div class="text-center mb-4">
      <h2 class="text-uppercase fw-bold">Armá tu <span class="text-danger">Pedido</span></h2>
      <p class="text-muted">Seleccioná los productos, indicá cantidad y pedí presupuesto por WhatsApp.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="card shadow border-0 overflow-hidden">
          <div class="card-header bg-white p-4 border-bottom">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="fas fa-search"></i>
              </span>
              <input type="text" 
                     class="form-control bg-light border-start-0 py-2 shadow-none" 
                     placeholder="Buscar producto (ej: tarjetas, vinilos...)"
                     [(ngModel)]="terminoBusqueda">
            </div>
          </div>
          
          <div class="card-body p-0">
            <div class="product-list-container">
               <div class="list-group list-group-flush">
                 
                 <div class="list-group-item d-flex align-items-center justify-content-between py-3 px-4" 
                      *ngFor="let prod of productosFiltrados">
                   
                   <div class="d-flex align-items-center" style="flex: 1;">
                     <i class="fas fa-check-circle text-danger me-3 fs-5 transition-icon" 
                        [class.opacity-25]="!prod.cantidad"></i>
                     <span class="fw-bold text-dark">{{ prod.nombre }}</span>
                   </div>

                   <div class="d-flex align-items-center gap-2 ms-3">
                     <input type="number" 
                            class="form-control text-center fw-bold border-secondary-subtle input-cantidad" 
                            placeholder="0" 
                            min="0"
                            [(ngModel)]="prod.cantidad">
                     <span class="text-muted small d-none d-sm-inline text-end unidad-label">{{ prod.unidad }}</span>
                   </div>
                 </div>

                 <div *ngIf="productosFiltrados.length === 0" class="text-center py-5 text-muted">
                    <i class="fas fa-search fa-2x mb-3 text-secondary opacity-50"></i>
                    <p class="m-0">No encontramos productos con ese nombre.</p>
                 </div>

               </div>
            </div>
          </div>

          <div class="card-footer p-4 bg-light border-top">
            <button (click)="enviarPresupuesto()" class="btn btn-danger btn-lg w-100 shadow-sm py-3 fw-bold transition-btn">
              <i class="fab fa-whatsapp fa-lg me-2"></i> SOLICITAR PRESUPUESTO
            </button>
          </div>

        </div>

      </div>
    </div>

  </div>
</section>
